managebac:
  base_url: "https://YOUR_SCHOOL.managebac.com"
  email: "parent@example.com"
  password: "YOUR_PASSWORD_HERE"

# Children names (IDs will be discovered during --explore)
children:
  - name: "Child A"
    # id: "12345"  # Uncomment after running --explore
    # color: "#9B59B6"  # LINE Flex Message header color
  - name: "Child B"
    # id: "67890"
    # color: "#0D6EFD"

telegram:
  bot_token_file: "~/.telegram-bot-token"
  chat_id: "YOUR_CHAT_ID"
  # thread_id: 4               # optional: forum topic in a supergroup with Topics enabled
  # tg_notify_topic: "school"  # optional: take chat, thread and token file from tg-notify's
  #                            # routes.toml instead of the three keys above

# LINE group notification (optional)
line:
  channel_token_file: "~/.line-channel-token"
  group_id: "YOUR_GROUP_ID"

# How many days ahead to consider "upcoming"
upcoming_days: 3

# Only show overdue tasks with due dates on or after this date
# Useful to ignore last-semester overdue tasks after a break
# overdue_since: "2026-01-24"

# Tasks to ignore (won't appear in notifications)
# Match by title substring (case-insensitive)
ignore_tasks:
  # - "some task title to ignore"
  # - "optional homework"
